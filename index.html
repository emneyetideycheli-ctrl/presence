<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valider ma présence</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-4 flex justify-center items-center">

  <div class="bg-white p-6 rounded-3xl shadow-xl max-w-sm w-full border border-slate-100">
    <div class="text-center mb-4">
      <h1 class="text-2xl font-bold text-slate-700">Valider ma présence</h1>
      <p class="text-xs text-slate-400">Complétez vos informations</p>
    </div>

    <!-- بطاقة معلومات الحصة الحالية -->
    <div class="bg-emerald-50/50 border border-emerald-300 rounded-2xl p-4 mb-6">
      <h2 class="text-emerald-700 font-bold text-lg mb-3 flex items-center gap-1">
        📋 Séance en cours
      </h2>
      
      <div class="space-y-2 text-sm">
        <div class="bg-white p-2 rounded-xl border border-emerald-100">
          <span class="text-xs text-slate-400 block">📚 Cours</span>
          <span id="cours" class="font-bold text-slate-800">...</span>
        </div>
        <div class="bg-white p-2 rounded-xl border border-emerald-100">
          <span class="text-xs text-slate-400 block">👨‍🏫 Enseignant</span>
          <span id="enseignant" class="font-bold text-slate-800">...</span>
        </div>
        <div class="bg-white p-2 rounded-xl border border-emerald-100">
          <span class="text-xs text-slate-400 block">🎯 Cohorte</span>
          <span id="cohorte" class="font-bold text-slate-800">...</span>
        </div>
        <div class="bg-white p-2 rounded-xl border border-emerald-100">
          <span class="text-xs text-slate-400 block">📅 Date</span>
          <span id="date" class="font-bold text-slate-800">...</span>
        </div>
        <div class="bg-white p-2 rounded-xl border border-emerald-100">
          <span class="text-xs text-slate-400 block">⏰ Heure</span>
          <span id="heure" class="font-bold text-slate-800">...</span>
        </div>
      </div>
    </div>

    <!-- نموذج ادخال بيانات الطالبة -->
    <form id="studentForm" class="space-y-3">
      <h3 class="font-bold text-slate-700 flex items-center gap-1">✍️ Vos informations</h3>
      
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Nom *</label>
        <input type="text" id="nom" required class="w-full border rounded-xl p-2.5 text-sm bg-slate-50 focus:bg-white focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Prénom *</label>
        <input type="text" id="prenom" required class="w-full border rounded-xl p-2.5 text-sm bg-slate-50 focus:bg-white focus:outline-emerald-500">
      </div>
      <div>
        <label class="block text-xs font-semibold text-slate-500 mb-1">Numéro *</label>
        <input type="tel" id="numero" required class="w-full border rounded-xl p-2.5 text-sm bg-slate-50 focus:bg-white focus:outline-emerald-500">
      </div>

      <button type="submit" id="btnSubmit" class="w-full bg-emerald-600 text-white font-bold py-3 rounded-xl mt-4 shadow-lg shadow-emerald-200 hover:bg-emerald-700 transition">
        Envoyer
      </button>
    </form>
    
    <div id="successMsg" class="hidden text-center py-6 text-emerald-600 font-bold">
      ✅ Présence enregistrée avec succès!
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbygJDUWrHO2YhNt-RyiZ4qiiP4DsagYb82jrQ1-GVOVCbMeyfGr_MDenBArWI4gIHow/exec"; 
    
    // قراءة id الحصة من رابط QR
    const urlParams = new URLSearchParams(window.location.search);
    const seanceId = urlParams.get('id');

    // جلب بيانات الحصة عند فتح الصفحة
    async function loadSeance() {
      if (!seanceId) {
        alert("Lien invalide (ID Séance manquant)");
        return;
      }
      
      const res = await fetch(`${API_URL}?action=getSeance&id=${seanceId}`);
      const data = await res.json();
      
      if (data.status === "success") {
        document.getElementById('cours').innerText = data.cours;
        document.getElementById('enseignant').innerText = data.enseignant;
        document.getElementById('cohorte').innerText = data.cohorte;
        document.getElementById('date').innerText = data.date;
        document.getElementById('heure').innerText = data.heure;
      } else {
        alert("Séance introuvable!");
      }
    }

    // إرسال الحضور
    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Envoi...";
      btn.disabled = true;

      const payload = {
        action: "registerPresence",
        seanceId: seanceId,
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        numero: document.getElementById('numero').value
      };

      await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      document.getElementById('studentForm').classList.add('hidden');
      document.getElementById('successMsg').classList.remove('hidden');
    });

    loadSeance();
  </script>
</body>
</html>
