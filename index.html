<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valider ma présence - SAFIA Dar Naim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .purple-card { background: white; border-radius: 1.75rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .purple-btn { background-color: #7e22ce; color: white; transition: all 0.2s; }
    .purple-btn:hover { background-color: #6b21a8; }
    .header-badge { background-color: #581c87; color: white; border-radius: 1rem; }
  </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

  <div class="purple-card w-full max-w-md p-6 relative">

    <div class="header-badge p-3 text-center text-xs font-bold tracking-wide mb-4">
      📍 CENTRE SAFIA — DAR NAIM
    </div>
    
    <div class="text-center mb-4">
      <h2 class="text-2xl font-extrabold text-slate-800 flex justify-center items-center gap-2">
        🎓 Valider ma présence
      </h2>
      <p class="text-xs text-slate-400">Complétez vos informations</p>
    </div>

    <div class="bg-purple-50/50 border border-purple-100 rounded-2xl p-4 mb-5 space-y-3">
      <h3 class="text-base font-bold text-purple-900 flex items-center gap-2 border-b border-purple-100 pb-2">
        📋 Séance en cours
      </h3>
      
      <div class="bg-white rounded-xl p-2.5 border border-purple-50 text-xs">
        <span class="text-slate-400 font-medium">📚 Cours</span>
        <p id="viewCours" class="font-bold text-slate-800 text-sm mt-0.5">Chargement...</p>
      </div>

      <div class="bg-white rounded-xl p-2.5 border border-purple-50 text-xs">
        <span class="text-slate-400 font-medium">👩‍🏫 Formatrice</span>
        <p id="viewFormatrice" class="font-bold text-slate-800 text-sm mt-0.5">Chargement...</p>
      </div>

      <div class="bg-white rounded-xl p-2.5 border border-purple-50 text-xs">
        <span class="text-slate-400 font-medium">🎯 Cohorte</span>
        <p id="viewCohorte" class="font-bold text-slate-800 text-sm mt-0.5">Chargement...</p>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div class="bg-white rounded-xl p-2.5 border border-purple-50 text-xs">
          <span class="text-slate-400 font-medium">📅 Date</span>
          <p id="viewDate" class="font-bold text-slate-800 mt-0.5">-</p>
        </div>
        <div class="bg-white rounded-xl p-2.5 border border-purple-50 text-xs">
          <span class="text-slate-400 font-medium">⏰ Heure</span>
          <p id="viewHeure" class="font-bold text-slate-800 mt-0.5">-</p>
        </div>
      </div>
    </div>

    <form id="studentForm" class="space-y-3">
      <h3 class="text-sm font-bold text-slate-800 flex items-center gap-1">
        ✍️ Vos informations
      </h3>
      
      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Nom *</label>
        <input type="text" id="nom" placeholder="Votre nom de famille" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Prénom *</label>
        <input type="text" id="prenom" placeholder="Votre prénom" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-600 mb-1">Numéro étudiant *</label>
        <input type="text" id="numero" placeholder="Ex : E12345678" required class="w-full bg-slate-50 border border-slate-200 rounded-xl p-3 text-sm">
      </div>

      <button type="submit" id="btnSubmit" class="w-full purple-btn py-3.5 rounded-2xl font-bold text-sm shadow-md mt-4 flex justify-center items-center gap-2">
        ✅ Valider ma présence
      </button>
    </form>
    
    <div id="successMessage" class="hidden text-center text-purple-700 font-bold mt-4 p-3 bg-purple-50 rounded-xl">
      ✨ Votre présence a été enregistrée avec succès!
    </div>

    <div class="text-center text-[10px] text-slate-400 mt-6 border-t pt-3">
      © 2026 — SAFIA Dar Naim
    </div>

  </div>

  <script>
    // ⚠️ ضعي نفس رابط الـ Web App الخاص بـ Google Apps Script هنا
    const API_URL = "ضع_رابط_الجوجل_اسكريبت_هنا";

    const urlParams = new URLSearchParams(window.location.search);
    const seanceId = urlParams.get('seance_id');

    if (seanceId) {
      loadSeanceDetails(seanceId);
    }

    async function loadSeanceDetails(id) {
      try {
        const res = await fetch(`${API_URL}?action=getSeance&id=${id}`);
        const data = await res.json();
        if(data.status === "success") {
          document.getElementById('viewCours').innerText = data.cours;
          document.getElementById('viewFormatrice').innerText = data.formatrice;
          document.getElementById('viewCohorte').innerText = data.cohorte;
          document.getElementById('viewDate').innerText = data.date;
          document.getElementById('viewHeure').innerText = data.heure;
        }
      } catch (e) {
        console.error("Erreur de chargement");
      }
    }

    document.getElementById('studentForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnSubmit');
      btn.innerText = "Enregistrement...";
      btn.disabled = true;

      const payload = {
        action: "registerPresence",
        seanceId: seanceId,
        nom: document.getElementById('nom').value,
        prenom: document.getElementById('prenom').value,
        numero: document.getElementById('numero').value
      };

      try {
        await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        document.getElementById('studentForm').classList.add('hidden');
        document.getElementById('successMessage').classList.remove('hidden');
      } catch (err) {
        alert("Erreur lors de l'enregistrement");
        btn.innerText = "✅ Valider ma présence";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
