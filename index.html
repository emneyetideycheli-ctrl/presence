<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validation de Présence - SAFIA Dar Naim</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e2e8f0;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-6 px-3 sm:px-4">

    <!-- 🌟 MAIN CONTAINER WITH ROUNDED CORNERS -->
    <div class="w-full max-w-md bg-white rounded-[32px] shadow-xl border border-gray-100 p-5 sm:p-6 flex flex-col items-center relative overflow-hidden">

        <!-- 🏢 CENTER NAME BANNER (اسم المركز بتصميم جذاب) -->
        <div class="w-full bg-gradient-to-r from-purple-900 via-purple-700 to-purple-900 text-white rounded-2xl py-2.5 px-4 shadow-sm mb-3 flex items-center justify-center gap-2 border border-purple-300/30">
            <span class="text-amber-300 text-sm">📍</span>
            <span class="text-xs sm:text-sm font-extrabold tracking-wide uppercase">Centre SAFIA — Dar Naim</span>
        </div>

        <!-- 🌟 TOP HEADER CONTAINER (شريط الشعار العلوي) -->
        <header class="w-full bg-slate-50/80 rounded-2xl p-2 shadow-inner border border-gray-100 flex items-center justify-between mb-5">
            
            <!-- 👈 جهة اليسار: شعار SAFIA -->
            <div class="flex items-center">
                <div class="w-11 h-11 rounded-full overflow-hidden border border-purple-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="safia.jpg" alt="SAFIA" class="w-full h-full object-cover">
                </div>
            </div>

            <!-- 👉 جهة اليمين: شعارا موريتانيا واليونيسف -->
            <div class="flex items-center gap-2">
                <!-- الجمهورية الإسلامية الموريتانية -->
                <div class="w-11 h-11 rounded-full overflow-hidden border border-gray-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="mauritania.jpg" alt="Mauritanie" class="w-full h-full object-cover">
                </div>

                <!-- UNICEF -->
                <div class="w-11 h-11 rounded-full overflow-hidden border border-sky-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="unicef.jpg" alt="UNICEF" class="w-full h-full object-cover">
                </div>
            </div>

        </header>

        <!-- Page Title -->
        <h1 class="text-2xl sm:text-3xl font-extrabold text-[#1e293b] text-center flex items-center justify-center gap-2 mb-1">
            <span>🎓</span> Présence Étudiante
        </h1>
        <p id="pageSubTitle" class="text-gray-400 text-xs sm:text-sm mb-4 font-normal text-center">Enregistrez votre حضور للحصة</p>

        <!-- Top Purple Divider Line -->
        <div class="w-full h-[3px] bg-gradient-to-r from-purple-900 via-purple-600 to-purple-800 rounded-full mb-5"></div>

        <!-- 📌 Session Info Badge (ملخص بيانات الحصة الملتقطة من الـ QR Code) -->
        <div id="sessionCard" class="w-full bg-purple-50/80 border border-purple-100 rounded-2xl p-3.5 mb-5 text-center hidden">
            <span class="inline-block bg-purple-700 text-white text-[10px] font-bold px-3 py-0.5 rounded-full mb-1">Détails de la séance</span>
            <p id="infoCours" class="text-base font-extrabold text-purple-950">...</p>
            <p id="infoEnseignant" class="text-xs text-gray-600 font-medium">...</p>
            <div class="flex items-center justify-center gap-2 text-xs font-bold text-purple-700 pt-1">
                <span id="infoCohorte" class="bg-purple-200/60 px-2 py-0.5 rounded-md">...</span>
                <span>•</span>
                <span id="infoDateTime">...</span>
            </div>
        </div>

        <!-- 1️⃣ STUDENT FORM (نموذج إدخال الطالبة) -->
        <form id="studentForm" class="w-full space-y-4" autocomplete="off">
            
            <div>
                <label class="block text-xs font-bold text-[#1e293b] mb-1.5 uppercase tracking-wider">Nom complet de l'étudiante *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-base">👩‍🎓</span>
                    <input type="text" id="studentName" name="student_fullname" placeholder="Entrez votre nom et prénom" required autocomplete="off" 
                           class="w-full pl-10 pr-3.5 py-3.5 text-sm bg-slate-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-purple-600 focus:ring-4 focus:ring-purple-100 outline-none transition font-medium text-gray-800">
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-[#1e293b] mb-1.5 uppercase tracking-wider">Numéro / Code *</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-base">🔢</span>
                    <input type="text" id="studentCode" name="student_code" placeholder="Ex: N° d'inscription" required autocomplete="off" 
                           class="w-full pl-10 pr-3.5 py-3.5 text-sm bg-slate-50 border border-gray-200 rounded-2xl focus:bg-white focus:border-purple-600 focus:ring-4 focus:ring-purple-100 outline-none transition font-medium text-gray-800">
                </div>
            </div>

            <button type="submit" 
                    class="w-full bg-gradient-to-r from-purple-800 via-purple-700 to-purple-600 hover:from-purple-900 hover:to-purple-800 text-white font-extrabold text-base py-4 rounded-2xl transition shadow-lg shadow-purple-200 flex items-center justify-center gap-2 mt-6 active:scale-[0.99]">
                <span>✅</span> Confirmer ma Présence
            </button>
        </form>

        <!-- 2️⃣ SUCCESS MESSAGE CONTAINER -->
        <div id="successCard" class="hidden w-full flex-col items-center py-6 text-center animate-in fade-in zoom-in duration-300">
            <div class="w-20 h-20 bg-purple-100 text-purple-700 rounded-full flex items-center justify-center text-4xl mb-4 border-4 border-purple-200 shadow-inner">
                ✓
            </div>
            <h2 class="text-xl font-extrabold text-purple-950 mb-1">Présence Enregistrée !</h2>
            <p class="text-xs text-gray-500 max-w-xs mb-6">
                Votre présence a été enregistrée avec succès pour cette séance.
            </p>
            <div class="w-full bg-slate-50 border border-gray-200 rounded-2xl p-4 text-xs font-medium text-gray-600">
                <p class="font-bold text-purple-900 text-sm mb-1" id="savedStudentName">...</p>
                <p id="savedTime">...</p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center pt-6">
            <p class="text-xs text-gray-400 font-medium">
                © 2026 — SAFIA Dar Naim
            </p>
        </div>

    </div>

    <script>
        // قراءة المعلمات (URL Parameters) التي تم تمريرها عبر الـ QR Code
        const urlParams = new URLSearchParams(window.location.search);
        const cours = urlParams.get('cours');
        const enseignant = urlParams.get('enseignant');
        const cohorte = urlParams.get('cohorte');
        const date = urlParams.get('date');
        const heure = urlParams.get('heure');

        // إذا كانت بيانات الحصة موجودة في الرابط، يتم عرضها
        if (cours) {
            document.getElementById('sessionCard').classList.remove('hidden');
            document.getElementById('infoCours').innerText = cours;
            document.getElementById('infoEnseignant').innerText = "Enseignant(e): " + (enseignant || '-');
            document.getElementById('infoCohorte').innerText = cohorte || '-';
            document.getElementById('infoDateTime').innerText = `${date || ''} ${heure || ''}`;
        }

        // عند تأكيد الحضور
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();

            const name = document.getElementById('studentName').value.trim();
            const code = document.getElementById('studentCode').value.trim();

            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            document.getElementById('savedStudentName').innerText = name + (code ? ` (${code})` : '');
            document.getElementById('savedTime').innerText = "Enregistré à : " + timeString;

            // إخفاء النموذج وإظهار رسالة النجاح
            document.getElementById('studentForm').classList.add('hidden');
            document.getElementById('pageSubTitle').innerText = "Confirmation terminée";
            document.getElementById('successCard').classList.remove('hidden');
            document.getElementById('successCard').classList.add('flex');
        });
    </script>
</body>
</html>
