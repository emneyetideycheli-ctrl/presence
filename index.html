<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valider ma présence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #e2e8f0; /* خلفية الرمادي الناعم الخارجي */
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-4 px-2 sm:px-4">

    <div class="w-full max-w-md bg-white rounded-[32px] shadow-xl border border-gray-100 p-4 sm:p-6 flex flex-col items-center relative overflow-hidden">

        <div class="w-full bg-gradient-to-r from-purple-900 via-purple-700 to-purple-900 text-white rounded-2xl py-2.5 px-4 shadow-sm mb-3 flex items-center justify-center gap-2 border border-purple-300/30">
            <span class="text-amber-300 text-sm">📍</span>
            <span class="text-xs sm:text-sm font-extrabold tracking-wide uppercase">Centre SAFIA — Dar Naim</span>
        </div>

        <header class="w-full bg-white rounded-2xl p-2 shadow-sm border border-gray-100 flex items-center justify-between mb-4">
            
            <div class="flex items-center">
                <div class="w-11 h-11 rounded-full overflow-hidden border border-purple-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="safia.jpg" alt="SAFIA" class="w-full h-full object-cover">
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="w-11 h-11 rounded-full overflow-hidden border border-gray-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="mauritania.jpg" alt="Mauritanie" class="w-full h-full object-cover">
                </div>

                <div class="w-11 h-11 rounded-full overflow-hidden border border-sky-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="unicef.jpg" alt="UNICEF" class="w-full h-full object-cover">
                </div>
            </div>

        </header>

        <div id="topNav" class="w-full flex items-center justify-start mb-3">
            <button type="button" onclick="showWarningModal()" class="text-purple-800 font-semibold text-sm flex items-center gap-1 hover:underline outline-none">
                <span class="text-base">←</span> Quitter
            </button>
        </div>

        <h1 class="text-3xl font-extrabold text-[#1e293b] text-center flex items-center justify-center gap-2 mb-1">
            <span class="text-2xl">🎓</span> Valider ma présence
        </h1>
        <p id="pageSubTitle" class="text-gray-400 text-sm mb-4 font-normal">Complétez vos informations</p>

        <div class="w-full h-[3px] bg-gradient-to-r from-purple-900 via-purple-600 to-purple-800 rounded-full mb-6"></div>

        <div id="formContainer" class="w-full space-y-6">

            <div class="bg-purple-50 border-l-4 border-purple-700 rounded-3xl p-5 shadow-sm">
                <h2 class="text-2xl font-extrabold text-purple-900 mb-4 flex items-center gap-2">
                    <span>📋</span> Séance en cours
                </h2>

                <div class="space-y-3">
                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-purple-100">
                        <span class="text-xs text-gray-400 font-medium flex items-center gap-1 mb-0.5">📚 Spécialité</span>
                        <p id="coursDisplay" class="text-base font-bold text-[#1e293b]">...</p>
                    </div>

                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-purple-100">
                        <span class="text-xs text-gray-400 font-medium flex items-center gap-1 mb-0.5">👩‍🏫 Formatrice</span>
                        <p id="enseignantDisplay" class="text-base font-bold text-[#1e293b]">...</p>
                    </div>

                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-purple-100">
                        <span class="text-xs text-gray-400 font-medium flex items-center gap-1 mb-0.5">📅 Date</span>
                        <p id="dateDisplay" class="text-base font-bold text-[#1e293b]">...</p>
                    </div>

                    <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-purple-100">
                        <span class="text-xs text-gray-400 font-medium flex items-center gap-1 mb-0.5">⏰ Heure</span>
                        <p id="heureDisplay" class="text-base font-bold text-[#1e293b]">...</p>
                    </div>
                </div>
            </div>

            <div class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                <h2 class="text-2xl font-extrabold text-[#1e293b] mb-2 flex items-center gap-2">
                    <span>✍️</span> Vos informations
                </h2>
                <p class="text-xs text-gray-500 mb-6 leading-relaxed font-normal">
                    Complétez vos informations pour valider votre présence à cette séance.
                </p>

                <form id="studentForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-[#1e293b] mb-1.5">Nom *</label>
                        <input type="text" id="nom" placeholder="Votre nom de famille" required 
                               class="w-full p-3.5 text-sm bg-white border border-gray-200 rounded-2xl focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition placeholder:text-gray-300 font-medium">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[#1e293b] mb-1.5">Prénom *</label>
                        <input type="text" id="prenom" placeholder="Votre prénom" required 
                               class="w-full p-3.5 text-sm bg-white border border-gray-200 rounded-2xl focus:border-purple-500 focus
