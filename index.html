<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Présence</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-md">
        
        <!-- تفاصيل الحصة -->
        <div class="bg-emerald-50 border border-emerald-200 p-4 rounded-xl mb-6">
            <h3 class="text-lg font-bold text-emerald-800 mb-3 flex items-center gap-2">
                📋 Séance en cours
            </h3>
            <div class="space-y-2 text-sm text-gray-700">
                <p>📚 <strong>Cours:</strong> <span id="coursDisplay" class="font-medium text-gray-900">...</span></p>
                <p>👨‍🏫 <strong>Enseignant:</strong> <span id="enseignantDisplay" class="font-medium text-gray-900">...</span></p>
                <p>🎯 <strong>Cohorte:</strong> <span id="cohorteDisplay" class="font-medium text-gray-900">...</span></p>
                <p>📅 <strong>Date:</strong> <span id="dateDisplay" class="font-medium text-gray-900">...</span></p>
                <p>⏰ <strong>Heure:</strong> <span id="heureDisplay" class="font-medium text-gray-900">...</span></p>
            </div>
        </div>

        <!-- استمارة التسجيل -->
        <form id="studentForm" class="space-y-4">
            <h4 class="font-semibold text-gray-800 border-b pb-2">Complétez vos informations :</h4>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Nom *</label>
                <input type="text" id="nom" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Prénom *</label>
                <input type="text" id="prenom" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Numéro *</label>
                <input type="tel" id="numero" required class="w-full p-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition duration-200 mt-2">
                Envoyer
            </button>
        </form>

    </div>

    <script>
        // قراءة المعلمات الممررة عبر الرابط
        const urlParams = new URLSearchParams(window.location.search);
        
        const id = urlParams.get('id');
        const cours = urlParams.get('cours');
        const enseignant = urlParams.get('enseignant');
        const cohorte = urlParams.get('cohorte');
        const date = urlParams.get('date');
        const heure = urlParams.get('heure');

        // التثبت وقراءة البيانات
        if (!id) {
            alert("Séance introuvable!");
        } else {
            document.getElementById('coursDisplay').innerText = cours || '-';
            document.getElementById('enseignantDisplay').innerText = enseignant || '-';
            document.getElementById('cohorteDisplay').innerText = cohorte || '-';
            document.getElementById('dateDisplay').innerText = date || '-';
            document.getElementById('heureDisplay').innerText = heure || '-';
        }

        // إرسال البيانات (يمكن ربطها مع Google Sheets لاحقاً)
        document.getElementById('studentForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Présence enregistrée avec succès !");
        });
    </script>
</body>
</html>
