<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une Séance - SAFIA Dar Naim</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    :root {
      --primary: #6c5ce7;
      --primary-dark: #5b4bc4;
      --bg-color: #f4f6fa;
      --card-bg: #ffffff;
      --text-main: #2d3436;
      --text-muted: #a0aec0;
      --input-bg: #f8fafc;
      --border-color: #edf2f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    body {
      background-color: var(--bg-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .app-card {
      background: var(--card-bg);
      width: 100%;
      max-w: 380px;
      border-radius: 28px;
      padding: 24px 20px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.06);
    }

    /* الشريط العلوي */
    .top-badge {
      background: linear-gradient(135deg, #4834d4, #686de0);
      color: white;
      text-align: center;
      padding: 10px;
      border-radius: 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 16px;
    }

    /* الشعارات */
    .logos-container {
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 8px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      background: #fafafa;
    }

    .logo-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 800;
      color: white;
    }
    .logo-safia { background: #3c1361; }
    .logo-mr { background: #e67e22; font-size: 12px; }
    .logo-unicef { background: #00a8ff; font-size: 8px; }

    /* العناوين */
    .header-title {
      text-align: center;
      margin-bottom: 20px;
    }
    .header-title h2 {
      font-size: 20px;
      color: var(--text-main);
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .header-title p {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .divider {
      height: 2px;
      background: var(--primary);
      border-radius: 2px;
      margin-top: 12px;
      width: 100%;
    }

    /* الحقول */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block;
      font-size: 10px;
      font-weight: 800;
      color: #4a5568;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-icon {
      position: absolute;
      left: 14px;
      font-size: 14px;
    }

    .custom-input, .custom-select {
      width: 100%;
      padding: 12px 14px 12px 40px;
      background: var(--input-bg);
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      font-size: 13px;
      color: var(--text-main);
      outline: none;
      transition: all 0.2s;
    }
    .custom-input:focus, .custom-select:focus {
      border-color: var(--primary);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.1);
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .custom-input.center {
      padding-left: 14px;
      text-align: center;
      font-weight: 600;
      font-size: 12px;
    }

    /* الزر */
    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 16px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      box-shadow: 0 8px 15px rgba(108, 92, 231, 0.25);
      transition: background 0.2s;
    }
    .submit-btn:hover { background: var(--primary-dark); }

    .footer-text {
      text-align: center;
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 20px;
    }

    #qrContainer {
      margin-top: 20px;
      text-align: center;
    }
    #qrcode {
      display: inline-block;
      padding: 10px;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 16px;
    }
  </style>
</head>
<body>

  <div class="app-card">
    <!-- الشريط العلوي -->
    <div class="top-badge">📍 CENTRE SAFIA — DAR NAIM</div>

    <!-- الشعارات -->
    <div class="logos-container">
      <div class="logo-badge logo-safia">SAFIA</div>
      <div style="display: flex; gap: 6px;">
        <div class="logo-badge logo-mr">🇲🇷</div>
        <div class="logo-badge logo-unicef">unicef</div>
      </div>
    </div>

    <!-- العنوان -->
    <div class="header-title">
      <h2>✨ Créer une Séance</h2>
      <p>Remplissez les détails de la séance</p>
      <div class="divider"></div>
    </div>

    <!-- النموذج -->
    <form id="createForm">
      <div class="form-group">
        <label>COURS *</label>
        <div class="input-wrapper">
          <span class="input-icon">📚</span>
          <input type="text" id="cours" class="custom-input" placeholder="Ex: Couture, Informatique..." required>
        </div>
      </div>

      <div class="form-group">
        <label>FORMATRICE *</label>
        <div class="input-wrapper">
          <span class="input-icon">👩‍🏫</span>
          <input type="text" id="formatrice" class="custom-input" placeholder="Votre nom complet" required>
        </div>
      </div>

      <div class="form-group">
        <label>COHORTE *</label>
        <div class="input-wrapper">
          <span class="input-icon">🎯</span>
          <select id="cohorte" class="custom-select" required>
            <option value="C7.A">C7.A</option>
            <option value="C7.B">C7.B</option>
          </select>
        </div>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label>DATE *</label>
          <input type="text" id="date" class="custom-input center" readonly>
        </div>
        <div class="form-group">
          <label>HEURE *</label>
          <input type="text" id="heure" class="custom-input center" readonly>
        </div>
      </div>

      <button type="submit" id="btnCreate" class="submit-btn">📱 Générer QR Code</button>
    </form>

    <div id="qrContainer" style="display:none;">
      <div id="qrcode"></div>
    </div>

    <div class="footer-text">© 2026 — SAFIA Dar Naim</div>
  </div>

  <script>
    const API_URL = "ضع_رابط_الجوجل_اسكريبت_هنا";

    const now = new Date();
    document.getElementById('date').value = now.toLocaleDateString('fr-FR', { day: 'numeric', month: 'short', year: 'numeric' });
    document.getElementById('heure').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnCreate');
      btn.innerText = "Création en cours...";
      btn.disabled = true;

      const payload = {
        action: "createSeance",
        cours: document.getElementById('cours').value,
        formatrice: document.getElementById('formatrice').value,
        cohorte: document.getElementById('cohorte').value,
        heure: document.getElementById('heure').value,
        date: document.getElementById('date').value
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const data = await res.json();

        if(data.status === "success") {
          document.getElementById('qrContainer').style.display = "block";
          document.getElementById('qrcode').innerHTML = "";
          const studentPageUrl = window.location.href.replace('Teacher.html', 'Student.html');
          
          new QRCode(document.getElementById("qrcode"), { 
            text: `${studentPageUrl}?seance_id=${data.id}`, 
            width: 150, 
            height: 150 
          });
        }
      } catch (err) {
        alert("Erreur lors de la création");
      } finally {
        btn.innerText = "📱 Générer QR Code";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
