<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une Séance - SAFIA Dar Naim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .card-container { background: white; border-radius: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    .purple-badge { background-color: #5b21b6; color: white; border-radius: 1.2rem; }
    .purple-btn { background: #7c3aed; color: white; transition: all 0.2s; }
    .purple-btn:hover { background: #6d28d9; }
    .input-box { background-color: #f8fafc; border: 1px solid #f1f5f9; border-radius: 1.2rem; }
  </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

  <div class="card-container w-full max-w-sm p-6">

    <!-- 📍 الشريط العلوي البنفسجي -->
    <div class="purple-badge p-3 text-center text-xs font-bold tracking-wide mb-4">
      📍 CENTRE SAFIA — DAR NAIM
    </div>

    <!-- 🏛️ مربع الشعارات الثلاثة -->
    <div class="border border-slate-100 rounded-2xl p-2 mb-6 flex justify-between items-center bg-white shadow-sm">
      <div class="w-10 h-10 rounded-full bg-purple-900 flex items-center justify-center text-white text-[9px] font-bold">
        SAFIA
      </div>
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-amber-500 flex items-center justify-center text-[10px]">🇲🇷</div>
        <div class="w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center text-white text-[8px] font-bold">unicef</div>
      </div>
    </div>

    <!-- العنوان والفاصل -->
    <div class="text-center mb-6">
      <h2 class="text-2xl font-bold text-slate-900 flex justify-center items-center gap-2">
        ✨ Créer une Séance
      </h2>
      <p class="text-xs text-slate-400 mt-1">Remplissez les détails de la séance</p>
      <div class="h-[2px] w-full bg-purple-700 mt-4"></div>
    </div>

    <!-- النموذج -->
    <form id="createForm" class="space-y-4">
      <div>
        <label class="block text-[11px] font-bold text-slate-800 uppercase mb-1.5 tracking-wider">COURS *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-base">📚</span>
          <input type="text" id="cours" placeholder="Ex: Couture, Informatique..." required class="input-box w-full py-3.5 pl-11 pr-4 text-sm text-slate-700 focus:outline-none">
        </div>
      </div>

      <!-- 🟢 1. تعديل المسمى إلى FORMATRICE -->
      <div>
        <label class="block text-[11px] font-bold text-slate-800 uppercase mb-1.5 tracking-wider">FORMATRICE *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-base">👩‍🏫</span>
          <input type="text" id="formatrice" placeholder="Votre nom complet" required class="input-box w-full py-3.5 pl-11 pr-4 text-sm text-slate-700 focus:outline-none">
        </div>
      </div>

      <!-- 🟢 2. تعديل COHORTE إلى قائمة منسدلة (اختيار فقط: C7.A أو C7.B) -->
      <div>
        <label class="block text-[11px] font-bold text-slate-800 uppercase mb-1.5 tracking-wider">COHORTE *</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-base z-10">🎯</span>
          <select id="cohorte" required class="input-box w-full py-3.5 pl-11 pr-8 text-sm text-slate-700 focus:outline-none appearance-none cursor-pointer relative z-0">
            <option value="C7.A">C7.A</option>
            <option value="C7.B">C7.B</option>
          </select>
          <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-slate-400 text-xs">▼</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] font-bold text-slate-800 uppercase mb-1.5 tracking-wider">DATE *</label>
          <input type="text" id="date" readonly class="input-box w-full p-3.5 text-xs font-semibold text-center text-slate-700">
        </div>
        <div>
          <label class="block text-[11px] font-bold text-slate-800 uppercase mb-1.5 tracking-wider">HEURE *</label>
          <input type="text" id="heure" readonly class="input-box w-full p-3.5 text-xs font-semibold text-center text-slate-700">
        </div>
      </div>

      <button type="submit" id="btnCreate" class="w-full purple-btn py-4 rounded-2xl font-bold text-sm shadow-md mt-4 flex justify-center items-center gap-2">
        📱 Générer QR Code
      </button>
    </form>

    <div id="qrContainer" class="hidden mt-6 text-center">
      <div id="qrcode" class="flex justify-center p-3 bg-white rounded-2xl border"></div>
    </div>

    <div class="text-center text-[10px] text-slate-400 mt-6">
      © 2026 — SAFIA Dar Naim
    </div>

  </div>

  <script>
    const API_URL = "ضع_رابط_الجوجل_اسكريبت_هنا";

    const now = new Date();
    const options = { day: 'numeric', month: 'short', year: 'numeric' };
    document.getElementById('date').value = now.toLocaleDateString('fr-FR', options);
    document.getElementById('heure').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnCreate');
      btn.innerText = "Création en cours...";
      btn.disabled = true;

      const payload = {
        action: "createSeance",
        cours: document.getElementById('cours').value,
        formatrice: document.getElementById('formatrice').value,
        cohorte: document.getElementById('cohorte').value,
        heure: document.getElementById('heure').value,
        date: document.getElementById('date').value
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const data = await res.json();

        if(data.status === "success") {
          document.getElementById('qrContainer').classList.remove('hidden');
          document.getElementById('qrcode').innerHTML = "";
          const studentPageUrl = window.location.href.replace('teacher.html', 'student.html');
          
          new QRCode(document.getElementById("qrcode"), { 
            text: `${studentPageUrl}?seance_id=${data.id}`, 
            width: 160, 
            height: 160 
          });
        }
      } catch (err) {
        alert("Erreur lors de la création");
      } finally {
        btn.innerText = "📱 Générer QR Code";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
