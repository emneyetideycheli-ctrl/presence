<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer une Séance — Formatrice</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f3e8ff;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center py-4 px-2 sm:px-4">

    <div class="w-full max-w-md bg-white rounded-[32px] shadow-xl border border-purple-100 p-4 sm:p-6 flex flex-col items-center relative overflow-hidden">

        <div class="w-full bg-gradient-to-r from-purple-900 via-purple-700 to-purple-900 text-white rounded-2xl py-2.5 px-4 shadow-sm mb-3 flex items-center justify-center gap-2 border border-purple-300/30">
            <span class="text-amber-300 text-sm">📍</span>
            <span class="text-xs sm:text-sm font-extrabold tracking-wide uppercase">Centre SAFIA — Dar Naim</span>
        </div>

        <header class="w-full bg-white rounded-2xl p-2 shadow-sm border border-gray-100 flex items-center justify-between mb-4">
            <div class="flex items-center">
                <div class="w-11 h-11 rounded-full overflow-hidden border border-purple-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="safia.jpg" alt="SAFIA" class="w-full h-full object-cover">
                </div>
            </div>

            <div class="flex items-center gap-2">
                <div class="w-11 h-11 rounded-full overflow-hidden border border-gray-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="mauritania.jpg" alt="Mauritanie" class="w-full h-full object-cover">
                </div>

                <div class="w-11 h-11 rounded-full overflow-hidden border border-sky-200 shadow-sm flex items-center justify-center bg-white">
                    <img src="unicef.jpg" alt="UNICEF" class="w-full h-full object-cover">
                </div>
            </div>
        </header>

        <h1 class="text-3xl font-extrabold text-[#1e293b] text-center flex items-center justify-center gap-2 mb-1">
            <span class="text-2xl">👩‍🏫</span> Créer une Séance
        </h1>
        <p id="pageSubTitle" class="text-gray-400 text-sm mb-4 font-normal">Espace Formatrice</p>

        <div class="w-full h-[3px] bg-gradient-to-r from-purple-900 via-purple-600 to-purple-800 rounded-full mb-6"></div>

        <div id="formContainer" class="w-full space-y-6">

            <!-- نموذج الإدخال -->
            <div id="formBlock" class="bg-white rounded-3xl p-5 shadow-sm border border-gray-100">
                <h2 class="text-2xl font-extrabold text-[#1e293b] mb-2 flex items-center gap-2">
                    <span>📝</span> Détails de la séance
                </h2>
                <p class="text-xs text-gray-500 mb-6 leading-relaxed font-normal">
                    Remplissez les informations ci-dessous pour générer le QR Code de présence.
                </p>

                <form id="sessionForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-[#1e293b] mb-1.5">📚 Spécialité *</label>
                        <select id="cours" required 
                                class="w-full p-3.5 text-sm bg-white border border-gray-200 rounded-2xl focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition font-medium text-[#1e293b]">
                            <option value="" disabled selected>Sélectionnez une spécialité</option>
                            <option value="Agroalimentaire et Nutrition durable">🌾 Agroalimentaire et Nutrition durable</option>
                            <option value="Couture, Mode et Industrie Textile">🧵 Couture, Mode et Industrie Textile</option>
                            <option value="Communication digitale et Création Multimédia">💻 Communication digitale et Création Multimédia</option>
                            <option value="Esthétique et bien-être">💅 Esthétique et bien-être</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[#1e293b] mb-1.5">👩‍🏫 Formatrice *</label>
                        <input type="text" id="enseignant" placeholder="Nom de la formatrice" required 
                               class="w-full p-3.5 text-sm bg-white border border-gray-200 rounded-2xl focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition placeholder:text-gray-300 font-medium">
                    </div>

                    <div>
                        <label class="block text-sm font-bold text-[#1e293b] mb-1.5">🎯 Cohorte *</label>
                        <select id="cohorte" required 
                                class="w-full p-3.5 text-sm bg-white border border-gray-200 rounded-2xl focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition font-medium text-[#1e293b]">
                            <option value="" disabled selected>Sélectionnez la cohorte</option>
                            <option value="C7.A">C7.A</option>
                            <option value="C7.B">C7.B</option>
                        </select>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block text-sm font-bold text-[#1e293b] mb-1.5">📅 Date *</label>
                            <input type="date" id="date" required 
                                   class="w-full p-3.5 text-sm bg-white border border-gray-200 rounded-2xl focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition font-medium">
                        </div>

                        <div>
                            <label class="block text-sm font-bold text-[#1e293b] mb-1.5">⏰ Heure *</label>
                            <input type="time" id="heure" required 
                                   class="w-full p-3.5 text-sm bg-white border border-gray-200 rounded-2xl focus:border-purple-500 focus:ring-4 focus:ring-purple-100 outline-none transition font-medium">
                        </div>
                    </div>

                    <button type="submit" id="generateBtn"
                            class="w-full bg-gradient-to-r from-purple-800 to-purple-600 hover:from-purple-900 hover:to-purple-700 text-white font-extrabold text-base py-4 rounded-2xl transition shadow-md shadow-purple-200 flex items-center justify-center gap-2 mt-4">
                        <span>📲</span> Générer le QR Code
                    </button>
                </form>
            </div>

            <!-- عرض الـ QR Code -->
            <div id="qrResultContainer" class="hidden w-full bg-white rounded-3xl p-6 shadow-sm border border-purple-100 text-center flex flex-col items-center">
                <h2 class="text-2xl font-bold text-purple-900 mb-1">Séance Prête !</h2>
                <p class="text-xs text-gray-500 mb-5 font-normal">Faites scanner ce QR Code aux participantes :</p>

                <div class="w-full max-w-[270px] bg-gradient-to-b from-purple-50 via-white to-purple-50 p-5 rounded-[32px] border-2 border-purple-200 shadow-md mb-6 flex flex-col items-center">
                    <div class="flex items-center gap-2 mb-3 bg-white px-3 py-1.5 rounded-full border border-purple-200 shadow-sm">
                        <img src="safia.jpg" alt="SAFIA" class="w-6 h-6 rounded-full object-cover">
                        <span class="text-xs font-bold text-purple-900">Centre SAFIA</span>
                    </div>

                    <div class="p-3 bg-white rounded-2xl border border-purple-100 shadow-inner w-full">
                        <img id="qrCodeImg" src="" alt="QR Code" class="w-full h-auto rounded-lg">
                    </div>
                </div>

                <div class="w-full space-y-2.5">
                    <button type="button" onclick="copyUrl()" class="w-full bg-purple-100 hover:bg-purple-200 text-purple-900 font-bold py-3.5 rounded-2xl transition text-sm flex items-center justify-center gap-2 border border-purple-200/60">
                        <span>📋</span> Copier le lien
                    </button>

                    <button type="button" onclick="resetForm()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold py-3.5 rounded-2xl transition text-sm">
                        ➕ Créer une autre séance
                    </button>
                </div>
            </div>

            <div class="text-center pt-2 pb-2">
                <p class="text-xs text-gray-400 font-medium">
                    ©️ 2026 — Solution de gestion des présences
                </p>
            </div>

        </div>

    </div>

    <script>
        let currentTargetUrl = "";

        // ضبط التاريخ والوقت تلقائياً
        const today = new Date();
        document.getElementById('date').value = today.toISOString().split('T')[0];
        document.getElementById('heure').value = today.toTimeString().slice(0, 5);

        document.getElementById('sessionForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // 1. استخراج القيم وتنظيفها أولاً
            const coursVal = document.getElementById('cours').value;
            const enseignantVal = document.getElementById('enseignant').value.trim();
            const cohorteVal = document.getElementById('cohorte').value;
            const dateVal = document.getElementById('date').value;
            const heureVal = document.getElementById('heure').value;

            // 2. التشفير للرابط
            const cours = encodeURIComponent(coursVal);
            const enseignant = encodeURIComponent(enseignantVal);
            const cohorte = encodeURIComponent(cohorteVal);
            const date = encodeURIComponent(dateVal);
            const heure = encodeURIComponent(heureVal);
            const id = 's_' + Date.now();

            // 3. بناء الرابط المستهدف لصفحة الطالب
            const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/')) + '/index.html';
            currentTargetUrl = `${baseUrl}?id=${id}&cours=${cours}&enseignant=${enseignant}&cohorte=${cohorte}&date=${date}&heure=${heure}`;

            // 4. توليد الـ QR Code
            const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=260x260&color=6b21a8&data=${encodeURIComponent(currentTargetUrl)}`;
            document.getElementById('qrCodeImg').src = qrApi;

            // 5. تبديل الواجهة بعد ضمان سلامة الرابط
            document.getElementById('formBlock').style.display = 'none';
            document.getElementById('qrResultContainer').classList.remove('hidden');
            document.getElementById('qrResultContainer').scrollIntoView({ behavior: 'smooth' });
        });

        function copyUrl() {
            if (currentTargetUrl) {
                navigator.clipboard.writeText(currentTargetUrl);
                alert('Lien copié !');
            }
        }

        function resetForm() {
            document.getElementById('qrResultContainer').classList.add('hidden');
            document.getElementById('formBlock').style.display = 'block';
            document.getElementById('sessionForm').reset();
            
            const today = new Date();
            document.getElementById('date').value = today.toISOString().split('T')[0];
            document.getElementById('heure').value = today.toTimeString().slice(0, 5);
        }
    </script>
</body>
</html>
