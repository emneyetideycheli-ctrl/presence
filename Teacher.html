<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Créer une Séance - SAFIA Dar Naim</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body { background-color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .purple-card { background: white; border-radius: 1.75rem; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); }
    .purple-btn { background-color: #7e22ce; color: white; transition: all 0.2s; }
    .purple-btn:hover { background-color: #6b21a8; }
    .header-badge { background-color: #581c87; color: white; border-radius: 1rem; }
  </style>
</head>
<body class="min-h-screen p-4 flex justify-center items-center">

  <div class="purple-card w-full max-w-md p-6 relative">

    <div class="header-badge p-3 text-center text-xs font-bold tracking-wide mb-4">
      📍 CENTRE SAFIA — DAR NAIM
    </div>
    
    <div class="text-center mb-6">
      <h2 class="text-2xl font-extrabold text-slate-800 flex justify-center items-center gap-2">
        ✨ Créer une Séance
      </h2>
      <p class="text-xs text-slate-400 mt-1">Remplissez les détails de la séance</p>
    </div>

    <form id="createForm" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">COURS *</label>
        <input type="text" id="cours" placeholder="📚 Ex: Couture, Informatique..." required class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-purple-600">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">FORMATRICE *</label>
        <input type="text" id="formatrice" placeholder="👩‍🏫 Votre nom complet" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-purple-600">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase mb-1">COHORTE *</label>
        <select id="cohorte" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-purple-600">
          <option value="C7.A">🎯 C7.A</option>
          <option value="C7.B">🎯 C7.B</option>
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">DATE *</label>
          <input type="date" id="date" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-purple-600">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 uppercase mb-1">HEURE *</label>
          <input type="time" id="heure" required class="w-full bg-slate-50 border border-slate-200 rounded-2xl p-3 text-sm focus:outline-none focus:border-purple-600">
        </div>
      </div>

      <button type="submit" id="btnCreate" class="w-full purple-btn py-3.5 rounded-2xl font-bold text-sm shadow-md mt-2 flex justify-center items-center gap-2">
        📱 Générer QR Code
      </button>
    </form>

    <div id="qrContainer" class="hidden mt-6 text-center space-y-3">
      <p class="text-xs font-semibold text-purple-700">Séance créée avec succès! Affichez ce QR aux étudiantes:</p>
      <div id="qrcode" class="flex justify-center p-3 bg-white rounded-2xl border my-2"></div>
    </div>

    <div class="text-center text-[10px] text-slate-400 mt-6 border-t pt-3">
      © 2026 — SAFIA Dar Naim
    </div>

  </div>

  <script>
    // ⚠️ ضعي رابط الـ Web App الخاص بـ Google Apps Script هنا
    const API_URL = "ضع_رابط_الجوجل_اسكريبت_هنا";

    // وضع تاريخ ووقت اليوم تلقائياً للسهولة
    document.getElementById('date').valueAsDate = new Date();
    const now = new Date();
    document.getElementById('heure').value = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

    document.getElementById('createForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnCreate');
      btn.innerText = "Création en cours...";
      btn.disabled = true;

      const payload = {
        action: "createSeance",
        cours: document.getElementById('cours').value,
        formatrice: document.getElementById('formatrice').value,
        cohorte: document.getElementById('cohorte').value,
        heure: document.getElementById('heure').value,
        date: document.getElementById('date').value,
      };

      try {
        const res = await fetch(API_URL, { method: "POST", body: JSON.stringify(payload) });
        const data = await res.json();

        if(data.status === "success") {
          document.getElementById('qrContainer').classList.remove('hidden');
          document.getElementById('qrcode').innerHTML = "";
          
          // رابط صفحة الطالبة الموجه إليها كود QR
          const studentPageUrl = window.location.href.replace('teacher.html', 'student.html');
          const finalStudentUrl = `${studentPageUrl}?seance_id=${data.id}`;
          
          new QRCode(document.getElementById("qrcode"), { 
            text: finalStudentUrl, 
            width: 180, 
            height: 180 
          });
        }
      } catch (err) {
        alert("Erreur lors de la création de la séance");
      } finally {
        btn.innerText = "📱 Générer QR Code";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
